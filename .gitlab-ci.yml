default:
  image: python:3.10-slim-bookworm

stages:
  - lint
  - test

lint-job:
  stage: lint
  script:
    - pip install black
    - apt update
    - apt install -y git
    - black --check $(git ls-files | grep '.*\.py$') 

test-job:
  stage: test
  script:
    - export OMP_NUM_THREADS=4
    - apt update
    - apt install -y gcc
    - pip install pytest
    - pip install -r requirements.txt --extra-index-url=https://download.pytorch.org/whl/cpu
    - ulimit -v 8388608
    - pytest ./test-opt.py ./test-expr.py
